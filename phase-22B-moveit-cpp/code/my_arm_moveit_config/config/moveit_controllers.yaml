# moveit_controllers.yaml — MoveIt 使用的 controller 對應
#
# 這裡用 fake/mock controller(不真的接 hardware),
# MoveIt 把 plan 的 trajectory 直接 publish 到 joint_states,實機才換 ros2_control trajectory controller

moveit_simple_controller_manager:
  controller_names:
    - fake_arm_controller

  fake_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - link_1_joint
      - link_2_joint
      - link_3_joint
      - link_4_joint
      - link_5_joint
      - link_6_joint

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
