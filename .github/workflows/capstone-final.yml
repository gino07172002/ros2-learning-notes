# .github/workflows/capstone-final.yml
#
# 自動 build Capstone Final docker image 並 push 到 GHCR
#
# Trigger:
#   - push 到 main 且改動 phase-Capstone-Final / 任一依賴 phase 的 code
#   - 手動 workflow_dispatch
#
# 推到:
#   ghcr.io/<owner>/<repo>/capstone-final:latest
#   ghcr.io/<owner>/<repo>/capstone-final:<git-sha>
#
# 之後實機部署:
#   docker pull ghcr.io/gino07172002/ros2-learning-notes/capstone-final:latest
#   docker run --network host --ipc host ...
#
# Node.js 20 deprecation note (2025-09 GitHub 公告):
#   actions/checkout@v5 已支援 Node 24
#   docker/setup-buildx@v3 / login@v3 / metadata@v5 / build-push@v6 內部仍 Node 20
#   GitHub 會在 2026-06-02 強制 Node 24,docker/* actions 屆時應有對應更新
#   現在升 docker/build-push 從 v5 → v6(其餘維持最新)

name: Capstone Final — Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'phase-17-gazebo/**'
      - 'phase-22A-nav2-basics/**'
      - 'phase-23A-nav2-bt-plugin/**'
      - 'phase-CapstoneA-mobile/**'
      - 'phase-Capstone-Final/**'
      - '.github/workflows/capstone-final.yml'
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write          # 推 GHCR 需要

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR repo 名統一小寫(不能有大寫字母)
          images: ghcr.io/${{ github.repository_owner }}/ros2-learning-notes/capstone-final
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          # Build context = repo root,讓 Dockerfile COPY sibling phase
          # .dockerignore 在 repo root 生效,白名單只送 image 需要的 phase
          context: .
          file: phase-Capstone-Final/code/docker-capstone-a/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions cache 加速 build(下次只重 build 改動部分)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # multi-arch:同時 build amd64 (PC) + arm64 (Pi/Jetson)
          # 註解掉是因為 multi-arch build 約 30+ 分鐘,先 amd64 跑通再開
          # platforms: linux/amd64,linux/arm64
          # 失敗時把 build context 列表 + 中間層 stderr 印出來
          provenance: false

      - name: Image summary
        if: success()
        run: |
          echo "## 🏁 Capstone Final image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull on target machine:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/ros2-learning-notes/capstone-final:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
